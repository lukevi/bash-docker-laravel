<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Form Field Extractor</title>
  <link href="https://cdn.tailwindcss.com" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <h2>Upload PDF to Extract Form Fields</h2>
  <input type="file" id="pdf-upload" accept="application/pdf">
  <div class="flex flex-col md:flex-row gap-6 mt-4">
    <div class="flex-1">
      <h3 class="font-bold mb-2">Fields JSON:</h3>
      <pre id="output" class="bg-gray-100 p-4 rounded text-xs overflow-auto h-96"></pre>
    </div>
    <div class="flex-1">
      <h3 class="font-bold mb-2">Fields Plain Text:</h3>
      <pre id="output-text" class="bg-gray-100 p-4 rounded text-xs overflow-auto h-96"></pre>
    </div>
  </div>
  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.js"></script>
  <script>
    document.getElementById('pdf-upload').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const arrayBuffer = await file.arrayBuffer();
        const pdfjsLib = window.pdfjsLib;
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let result = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const annotations = await page.getAnnotations();
        annotations
          .filter(a => a.subtype === 'Widget' && a.fieldName)
          .forEach(a => {
            result.push({
              name: a.fieldName,
              rect: a.rect,
              page: i
            });
          });
      }
      // Sort by page, then by rect[1] (y position, top to bottom), then rect[0] (x position, left to right)
      result.sort((a, b) => {
        if (a.page !== b.page) return a.page - b.page;
        if (a.rect[1] !== b.rect[1]) return b.rect[1] - a.rect[1];
        return a.rect[0] - b.rect[0];
      });
      document.getElementById('output').textContent = JSON.stringify(result, null, 2);
      // Plain text output: group by page
      let textOutput = '';
      let lastPage = null;
      result.forEach(field => {
        if (field.page !== lastPage) {
          textOutput += (lastPage !== null ? '\n' : '') + 'Page ' + field.page + ':\n';
          lastPage = field.page;
        }
        textOutput += field.name + '\n';
      });
      document.getElementById('output-text').textContent = textOutput.trim();
    });
  </script>
</body>
</html>
